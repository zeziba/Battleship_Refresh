name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8

    - name: Check code formatting with Black
      # This will automatically respect the line-length = 119 set in pyproject.toml
      run: black --check src/ tests/

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint  # Wait for the lint job to pass before running tests
    strategy:
      fail-fast: false  # Let all python versions finish even if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
        # Install development requirements (like pytest, pytest-cov)
        if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi
        
        # Install the project itself in editable mode
        pip install -e .

    - name: Run Tests with Coverage
      # This will use your pytest.ini and .coveragerc automatically
      run: |
        pytest