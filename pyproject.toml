[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Battleship_revisited"
version = "0.1.0"
description = "A terminal-based Battleship game"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Charles Engen", email = "owenengen@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/zeziba/Battleship_Refresh"
"Bug Tracker" = "https://github.com/zeziba/Battleship_Refresh/issues"

[project.scripts]
battleship = "src.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]

[tool.black]
line-length = 119
target-version = ['py311']