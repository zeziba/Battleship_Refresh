[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Battleship_revisited"
version = "0.0.1"
description = "Battleship the Game"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Charles Engen", email = "owenengen@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/zeziba/Battleship_revisited"
"Bug Tracker" = "https://github.com/zeziba/Battleship_revisited/issues"

[tool.setuptools.packages.find]
where = ["src"]